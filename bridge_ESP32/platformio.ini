; ══════════════════════════════════════════════════════════════════════════════
; bridge_ESP32 — PlatformIO Projektkonfiguration
;
; Hardware:
;   ESP32-S3 DevKitC-1  ←──SPI──→  MCP2518FD CAN-FD  ←──CAN FD──→  Instrumente
;   ESP32-S3 DevKitC-1  ←──WiFi UDP──→  bridge.exe (Windows PC)
;
; Protokollwandler: UDP [4B CAN-ID LE][≤64B Payload] ↔ CAN-FD Frame
; ══════════════════════════════════════════════════════════════════════════════

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Serieller Monitor → UART-Brücken-Port (CP2102N, GPIO43/44)
; COM-Port hier eintragen: monitor_port = COMx
monitor_port = COM3
monitor_speed   = 921600
;monitor_filters = esp32_exception_decoder
monitor_filters = default

; Upload (über UART-Brücken-Port oder nativen USB DFU)
upload_speed = 921600

; Compiler
; Board esp32-s3-devkitc-1 setzt ARDUINO_USB_CDC_ON_BOOT=1 als Default →
; build_unflags entfernt das zuerst, dann setzt build_flags explizit auf 0.
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3            ; 0=NONE 1=ERROR 2=WARN 3=INFO 4=DEBUG 5=VERBOSE
    -DARDUINO_USB_MODE=1            ; Nativer USB aktiv (GPIO19/20)
    -DARDUINO_USB_CDC_ON_BOOT=0     ; Serial0/Serial = UART0 (GPIO43/44) → CH343 → COM3
                                    ; MUSS explizit gesetzt werden — Board-Default für
                                    ; esp32-s3-devkitc-1 ist 1 (CDC), nicht 0!
                                    ; Mit =1: Serial → USB-CDC → COM6, CH343 bekommt nur
                                    ; ESP-IDF-Logs bei 115200 → bridge.exe kommuniziert ins Leere
    -DUSB_PRODUCT='"Cockpit_V1"'    ; Gerätename unter Windows
    ;
    ; ══════════════════════════════════════════════════════════════════════════
    ; MCP2518FD HARDWARE-FLAG
    ; ══════════════════════════════════════════════════════════════════════════
    ; AKTUELL: Hardware noch nicht vorhanden → CAN-FD Simulator aktiv.
    ;
    ; Wenn MCP2518FD angekommen: Semikolon VOR -DCAN_HW_ENABLED entfernen,
    ; dann neu bauen und flashen — Simulator wird automatisch deaktiviert.
    ;
    ; -DCAN_HW_ENABLED

; Bibliotheken
lib_deps =
    pierremolinaro/ACAN2517FD@^2.1.8

; Speicher-Layout (Standard)
board_build.partitions = default.csv
