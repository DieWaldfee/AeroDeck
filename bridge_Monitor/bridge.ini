; ══════════════════════════════════════════════════════════════════════════════
; bridge.ini — Konfiguration für MSFS SimConnect Bridge
; ══════════════════════════════════════════════════════════════════════════════
;
; GRUNDPRINZIP
; ─────────────
; bridge.exe liest Flugdaten aus dem MSFS-Simulator über SimConnect und
; sendet diese per UDP (oder USB) an einen ESP32-S3 Kommunikationsmodul.
; Das ESP32-Modul verteilt die Daten als CAN-Pakete an angeschlossene
; Anzeigegeräte — jedes Gerät hat eine eindeutige CAN-ID.
;
; Was gesendet wird, entscheidet ausschließlich die [simvars]-Liste.
; Auskommentierte Zeilen werden NICHT abonniert und NICHT gesendet.
; Der Modus (z.B. Gyro vs. Direkt) ergibt sich daraus, welche Variablen
; aktiv sind — die bridge.exe erkennt den Modus automatisch.
; Das Anzeigegerät entscheidet selbst, was es mit den empfangenen Werten macht.
;
; EINHEITEN (|unit nach dem Variablennamen)
; ──────────────────────────────────────────
; SimConnect speichert Werte intern und rechnet auf Wunsch in eine Zieleinheit um.
; Beispiel: "PLANE BANK DEGREES" ist intern in Grad — mit |radians bekommt
; die bridge.exe Bogenmaß, mit |degrees Grad.
;
;   |radians         Winkel in Bogenmaß          (Bank/Pitch → math. Verarbeitung)
;   |degrees         Winkel in Grad (0–360)       (Kompasskurs, Heading)
;   |number          Ganzzahl mit Vorzeichen, 2 Byte  (Kugel-Auslenkung −32768…+32767)
;   |status          Ganzzahl ohne Vorzeichen, 1 Byte (Status-Codes 0…255)
;   |bool            Wahrheitswert 0.0/1.0         (Schalter: aus=0 / ein=1)
;   |feet            Höhe in Fuß                   (Altitude, DH)
;   |feet per minute Steigrate in Fuß/Minute       (VSI)
;   |knots           Geschwindigkeit in Knoten     (IAS, GS, TAS)
;   |percent         Prozentwert 0–100             (Kraftstoff, Leistung, N1)
;   |mbar            Luftdruck in Millibar         (Kolisman-Einstellung)
;   |celsius         Temperatur in Grad Celsius    (OAT, IAT)
;
; Einheit weglassen → Standard "number" (Rohwert wie SimConnect ihn liefert)
;
; VOLLSTÄNDIGE SIMVAR-REFERENZ (alle verfügbaren Variablen mit Einheiten):
;   https://docs.flightsimulator.com/html/Programming_Tools/SimVars/Simulation_Variables.htm
;
; ══════════════════════════════════════════════════════════════════════════════

; ─── Verbindung zur Kommunikations-ESP32-S3 ──────────────────────────────────
[bridge]
; IP-Adresse des ESP32-S3 Kommunikationsmoduls.
; 255.255.255.255 = automatische Discovery (Broadcast): bridge.exe lernt die
; ESP32-IP aus dem ersten empfangenen UDP-Paket — keine feste IP nötig.
; Feste IP eintragen (z.B. 192.168.1.100) wenn kein Broadcast erwünscht ist.
udp_ip       = 255.255.255.255
; UDP-Port auf dem der ESP32-S3 lauscht (bridge → ESP32)
udp_port     = 4210
; UDP-Port auf dem bridge.exe lauscht (ESP32 → bridge, Rückkanal)
receive_port = 4211
; Mindestabstand zwischen zwei Sendevorgängen in Millisekunden.
; Bestimmt die maximale Senderate an alle Anzeige-Geräte (SimVar-Daten).
;   50 ms = max. 20 Hz  (Standard: gutes Gleichgewicht zwischen Flüssigkeit und Buslast)
;  100 ms = max. 10 Hz
;  200 ms = max.  5 Hz  (früher: heartbeat_ms, umbenannt zu send_interval_ms)
send_interval_ms = 50
; ─── Erstinbetriebnahme ──────────────────────────────────────────────────────
; Beim ersten Start (oder nach ESP32-Factory-Reset):
;   1. bridge.exe starten
;   2. ESP32 einschalten
; Dann überträgt bridge.exe das HID-Button-Mapping einmalig in den ESP32-NVS.
; Ab diesem Zeitpunkt ist das Mapping persistent — die Startreihenfolge ist
; danach irrelevant.
; HINWEIS: Die Achsen-Zuordnung ist RAM-only und wird bei jeder Verbindung
; automatisch neu übertragen.
;
; ─── USB-Verbindung (UART-Brücken-Port) ─────────────────────────────────────
; WICHTIG: Zwei USB-Ports am ESP32-S3 DevKit — jeder hat eine andere Rolle:
;   Nativer USB-Port  (GPIO19/20):  HID-Joystick → direkt an Windows/MSFS
;   UART-Brücken-Port (CP2102N):    Datentransport → bridge.exe  ← DIESER HIER
;
; usb_port = COM-Port des UART-Brücken-Anschlusses (z.B. COM3)
; usb_baud = Baudrate — MUSS mit JOY_UART_BAUD in bridge_ESP32/src/config.h
;            übereinstimmen (Standard: 921600)
; Wenn gesetzt: UART-Transport statt UDP (Priorität UART).
; Framing: [0xAA][0x55][len_lo][len_hi][CAN-ID 4B LE][Payload][XOR]
; Auskommentiert = nur UDP (WiFi).
usb_port = COM3
usb_baud = 921600

; ─── SimConnect-Verbindung ───────────────────────────────────────────────────
[simconnect]
; Name der Verbindung — erscheint in MSFS unter Add-ons → SimConnect.
; Kann frei gewählt werden, muss aber eindeutig sein wenn mehrere
; SimConnect-Clients gleichzeitig verbunden sind.
app_name = MSFS_Bridge

; ─── Bridge Monitor ──────────────────────────────────────────────────────────
[monitor]
; Monitor ein/ausschalten — false reduziert UDP-Traffic im Normalbetrieb
enabled  = true
; IP-Adresse des Rechners auf dem bridge_monitor läuft (127.0.0.1 = gleicher PC)
ip       = 127.0.0.1
; UDP-Port auf dem bridge_monitor lauscht (bridge_exe sendet Frames dorthin)
port     = 4220
; UDP-Port auf dem bridge_exe lauscht (bridge_monitor sendet Poll-Kommandos dorthin)
cmd_port   = 4221
; Intervall in dem bridge_monitor seinen Heartbeat (MON_LWT) sendet — nur zur Dokumentation
lwt_ms     = 2000
; Silence-Timeout: nach N ms ohne Monitor-Heartbeat (MON_LWT) → Monitor OFFLINE
timeout_ms = 6000

; ─── Debug-Ausgabe ───────────────────────────────────────────────────────────
[debug]
; Aktualisierungsrate der Debug-Anzeige in Millisekunden.
; 0 = jedes Frame (sehr hohe Refresh-Rate, kann flimmern).
; 100 ms = 10 Hz (gut lesbar).
refresh_ms = 100
;
; Die Debug-Anzeige wird NICHT automatisch gestartet — nur per Kommandozeile:
;   bridge.exe debug horizon               Anzeige für Instrument "horizon"
;   bridge.exe debug toFile [datei]        Alles in Datei protokollieren
;   bridge.exe debug horizon toFile        Beides kombiniert
;   bridge.exe help                        Alle Optionen anzeigen

; ══════════════════════════════════════════════════════════════════════════════
; BUTTON-MODULE
;
; Definiert Knopf-/Taster-/Schalter-Module die per CAN an den ESP32-S3-Bridge
; angeschlossen sind. Jedes Modul hat eine CAN-ID und eine Liste von Buttons.
;
; WICHTIG: Die can_id muss im JOY_CAN_ID-Bereich liegen (0x600..0x6FF),
;          damit der ESP32 die Frames an den HID-Decoder weiterleitet!
;
; Format: [module.NAME]              → Modul-Definition
;         [module.NAME.buttons]       → Button-Definitionen
;
; Button-Format:  name = payload_byte, payload_bit, physical_idx, hid_a [, hid_b] [, MODIFIER]
;   name          Lesbare Bezeichnung (max. 9 Zeichen, für SHOW MAP)
;   payload_byte  Byte-Nummer im CAN-Payload (1-basiert: 1 = Data[0], 2 = Data[1], …)
;                 0 ist reserviert und wird ignoriert — nicht verwenden.
;   payload_bit   Bit im Byte (0=LSB, 7=MSB)
;   physical_idx  Referenznummer 0..127 (für Diagnose/SHOW MAP, nicht protokollrelevant)
;   hid_a         Erster virtueller Joystick-Button (1..128)
;   hid_b         Zweiter Button optional → Chord (2 Buttons gleichzeitig drücken)
;   MODIFIER      Optionaler Keyboard-Modifier, der parallel zum HID-Report gesendet wird.
;                 Mögliche Werte: LSHIFT  RSHIFT  LALT  LCTRL  RCTRL
;                 Mehrere Modifier mit + kombinieren:  LCTRL+LSHIFT
;                 Sinnvoll für MSFS-Chord-Bindings die eine Modifier-Taste benötigen.
;
; Chord-Kodierung: Ein physikalischer Button aktiviert 2 HID-Buttons gleichzeitig.
;   MSFS erkennt die Kombination beim Konfigurieren.
;   Kapazität: 128 HID-Buttons = 128 Singles + 8128 Paare = 8256 phys. Buttons
;
; Das Instrument-Modul sendet rohe GPIO-Zustände (1 Bit pro Button, kein Typ-Byte):
;   Data[0]: Buttons an GPIOs 0–7
;   Data[1]: Buttons an GPIOs 8–15
;   ... usw.
;
; bridge.exe überträgt die Tabelle beim Start an den ESP32 (Reset → Einträge → Commit).
; ESP32 speichert sie im Flash (NVS) — nach Reboot sofort aktiv ohne bridge.exe.
; Diagnose: 'SHOW MAP' im Seriellen Terminal zeigt die aktuelle Tabelle an.
;
; ─── Beispiel-Konfiguration ──────────────────────────────────────────────────
;
; [module.cockpit_panel]
; can_id      = 0x623
; description = Cockpit Hauptpanel
;
; [module.cockpit_panel.buttons]
; ; name      = payload_byte, payload_bit, physical_idx, hid_a [, hid_b] [, MODIFIER]
; COM         = 8, 0, 37, 16, 17         ; Byte 8 Bit 0 → phys. 37 → HID 16+17 (Chord)
; NAV         = 8, 1, 38, 18             ; Byte 8 Bit 1 → phys. 38 → HID 18 (Single)
; APR         = 8, 2, 39, 19             ; Byte 8 Bit 2 → phys. 39 → HID 19
; TOGA        = 0, 0, 40, 20             ; Byte 0 Bit 0 → phys. 40 → HID 20
; AP_CHD      = 8, 3, 41, 21, 22, LSHIFT ; Chord + LSHIFT → MSFS-Chord-Binding
;
; [module.throttle_box]
; can_id      = 0x624
; description = Throttle-Box Schalter und Taster
;
; [module.throttle_box.buttons]
; FLAP_UP     = 0, 0, 50, 1, 2    ; Byte 0 Bit 0 → phys. 50 → HID 1+2 (Chord)
; FLAP_DN     = 0, 1, 51, 1, 3    ; Byte 0 Bit 1 → phys. 51 → HID 1+3 (Chord)
; GEAR        = 0, 2, 52, 1, 4    ; Byte 0 Bit 2 → phys. 52 → HID 1+4 (Chord)
; SPEED       = 0, 3, 53, 21      ; Byte 0 Bit 3 → phys. 53 → HID 21 (Single)

; ══════════════════════════════════════════════════════════════════════════════
; CAN-FD SIMULATOR — Input-Module solange MCP2518FD nicht vorhanden ist
;
; bridge.exe sendet beim Connect RESET + diese Mappings an den ESP32
; (ersetzt die Fallback-Einträge aus canSimulatorInit() sauber durch
;  den vollständigen Mapping-Pfad bridge.ini → bridge.exe → ESP32).
;
; ENTFERNEN wenn echte Input-Module konfiguriert werden.
; ══════════════════════════════════════════════════════════════════════════════

; ── Simulator: Buttons (CAN-ID 0x620) ────────────────────────────────────────
[module.sim_joystick]
can_tx_id            = 0x620        ; bridge → Gerät
can_rx_id            = 0x6A0        ; Gerät → bridge
description          = Simulator Joystick-Buttons
heartbeat_interval_ms = 1000
heartbeat_timeout_ms  = 3000

[module.sim_joystick.buttons]
; name  = payload_byte, payload_bit, physical_idx, hid_a [, hid_b]
BTN1    = 2, 0, 0, 1      ; B2 = 2. Byte (Index 1) Bit 0 → phys. 0 → HID Button 1 (Single)
BTN2    = 2, 1, 1, 3, 4   ; B2 = 2. Byte (Index 1) Bit 1 → phys. 1 → HID Button 3+4 (Chord)

; ── Simulator: Regler Achsen 0–3 (CAN-ID 0x621) ──────────────────────────────
[module.sim_axes14]
can_tx_id            = 0x621        ; bridge → Gerät
can_rx_id            = 0x6A1        ; Gerät → bridge
description          = Simulator Regler Achsen 0-3
heartbeat_interval_ms = 1000
heartbeat_timeout_ms  = 3000

[module.sim_axes14.axes]
; name = hid_axis_idx
AXIS1 = 0    ; HID Achse 0 (X)  — Sinus  8 s Periode
AXIS2 = 1    ; HID Achse 1 (Y)  — Sinus 12 s Periode
AXIS3 = 2    ; HID Achse 2 (Z)  — Sinus  6 s Periode
AXIS4 = 3    ; HID Achse 3 (Rx) — Sinus 16 s Periode

; ── Simulator: Regler Achse 5 + Button 6 (CAN-ID 0x622) ─────────────────────
[module.sim_axis5]
can_tx_id            = 0x622        ; bridge → Gerät
can_rx_id            = 0x6A2        ; Gerät → bridge
description          = Simulator Regler Achse 5 + Button 6
heartbeat_interval_ms = 1000
heartbeat_timeout_ms  = 3000

[module.sim_axis5.axes]
SLIDER = 5   ; HID Achse 5 (Rz) — Dreieckswelle 4 s Periode

[module.sim_axis5.buttons]
; name  = payload_byte, payload_bit, physical_idx, hid_a [, hid_b]
BTN6    = 5, 0, 5, 10, 11, LSHIFT  ; Byte 5 Bit 0 → phys. 5 → HID Button 10+11 (Chord)

; ══════════════════════════════════════════════════════════════════════════════
; FIELD-ID-TABELLE — globale Definitionen für alle Instrumente
;
; Jede SimVar die an ein Instrument übertragen werden soll bekommt eine
; eindeutige Field-ID. Das Instrument kennt alle Field-IDs fest im Code.
; bridge.exe schickt beim Start ein Init-Paket (CAN-Byte 0 = 0xFC), das
; dem Instrument mitteilt welche Field-IDs in welcher Reihenfolge und mit
; welchem Datentyp im Daten-Paket enthalten sind.
;
; Format:  VARIABLE NAME = 0xNN   ; Typ   Byte-Bedarf   Bedeutung
;
; Datentypen und Byte-Bedarf im CAN-Frame:
;   float32    4 Byte   Winkel (Radiant/Grad), Höhe, Geschwindigkeit, Druck …
;   int16      2 Byte   Ganzzahl mit Vorzeichen (−32768 … +32767)
;   uint8      1 Byte   Ganzzahl ohne Vorzeichen (0 … 255), Status-Codes
;   bool       1 Byte   Schalter: 0 = aus / 1 = ein
;
; Der Datentyp wird automatisch aus der Einheit der SimVar abgeleitet:
;   |radians |degrees |feet |knots |percent |mbar |celsius → float32  (4 Byte)
;   |number                                                → int16    (2 Byte, vorzeichenbehaftet)
;   |status                                                → uint8    (1 Byte, vorzeichenlos)
;   |bool                                                  → bool     (1 Byte)
;
; ─── Künstlicher Horizont / Attitude Indicator ───────────────────────────────
[field_ids]
; Gyro-Modus: Lage vom simulierten Kreisel (mit Drift)
ATTITUDE INDICATOR BANK DEGREES  = 0x01   ; float32   4 Byte
ATTITUDE INDICATOR PITCH DEGREES = 0x02   ; float32   4 Byte
;
; Direkt-Modus: ideale Fluglage direkt aus Simulation (kein Drift)
PLANE BANK DEGREES               = 0x03   ; float32   4 Byte
PLANE PITCH DEGREES              = 0x04   ; float32   4 Byte
;
; Kugel / Querneigungsanzeige (0 = koordinierter Flug)
TURN COORDINATOR BALL            = 0x05   ; int16     2 Byte   (−128 … +128) funktioniert nicht
INCIDENCE BETA 					 = 0x09	   ; float32   4 Byte    Winkel des Flugzeugs - nicht zwingend Instrumentenanzeige
; eigene Berechnung über die Beschleunigungen
ACCELERATION BODY X				 = 0x0A		; float32  4 Byte
ACCELERATION BODY Y				 = 0x0B		; float32  4 Byte
;
; Failure-Modus A: einfaches Sim-Ausfallmodell
PARTIAL PANEL ATTITUDE           = 0x06   ; uint8     1 Byte   (0=ok 1=warn 2=fail)
;
; Failure-Modus B: reale Avionics-Simulation (beide Vars aktiv = Modus B)
AVIONICS MASTER SWITCH           = 0x07   ; bool      1 Byte
LOW VOLTAGE WARNING              = 0x08   ; number      2 Byte
;
; ─── Config-Parameter-IDs — globale Definitionen für alle Instrumente ────────
[config_ids]
; Format: Parameter-Name = 0xNN    (config_id, 1 Byte)
; Wird in [module.X.config] referenziert. Pakettyp 0xFB, Format: [0xFB][N][id][val]...
slip_mode = 0x01   ; uint8  Kugel-Modus (0=INCIDENCE_BETA, 1=ACCEL_DAMPED)

; ─── Weitere Instrumente (Platzhalter für spätere Erweiterungen) ─────────────
; PLANE HEADING DEGREES MAGNETIC  = 0x20   ; float32   4 Byte
; PLANE ALTITUDE                  = 0x21   ; float32   4 Byte
; VERTICAL SPEED                  = 0x22   ; float32   4 Byte
; AIRSPEED INDICATED              = 0x23   ; float32   4 Byte
; KOHLSMAN SETTING MB:1           = 0x24   ; float32   4 Byte
; ENG N1 RPM:1                    = 0x30   ; float32   4 Byte
; FUEL TOTAL QUANTITY             = 0x31   ; float32   4 Byte

; ══════════════════════════════════════════════════════════════════════════════
; MODULE — Anzeige-Geräte, Input-Panels und gemischte Geräte
;
; Jeder Modul-Block besteht aus ein bis vier Sektionen:
;   [module.NAME]            → Gerät-Identifikation (can_tx_id, can_rx_id, …)
;   [module.NAME.simvars]    → SimConnect-Variablen → CAN-FD (Anzeige, LEDs)
;   [module.NAME.buttons]    → Button-Definitionen → HID
;   [module.NAME.axes]       → Achsen-Definitionen → HID
;   [module.NAME.config]     → Init-Parameter per CAN (z.B. brightness)
;
; Fähigkeiten ergeben sich aus vorhandenen Subsektionen:
;   Nur .simvars         → reines Anzeige-Gerät
;   Nur .buttons/.axes   → reines Input-Modul
;   Beides               → gemischtes Gerät (Panel mit Tasten + Kontrollleuchten)
;
; CAN-ID-REGELN — wichtig für Eindeutigkeit im System:
;   can_tx_id   bridge → Gerät   (Gerät empfängt auf dieser ID)
;   can_rx_id   Gerät → bridge   (Gerät sendet auf dieser ID)
;   Beide Felder sind Pflicht. Alle can_tx_id- UND can_rx_id-Werte des
;   gesamten Systems müssen eindeutig sein — kein Wert darf doppelt vorkommen.
;
; SimVar-Format:  VARIABLE NAME|einheit|field_id
;   field_id optional — fehlt er, wird die Variable aus [field_ids] aufgelöst.
;   Fehlt ein Eintrag in [field_ids]: Variable wird NICHT ins Init-Paket aufgenommen.
;
; ══════════════════════════════════════════════════════════════════════════════

; ─── Modul: Künstlicher Horizont ─────────────────────────────────────────────
[module.horizon]
can_tx_id            = 0x200        ; bridge → Gerät
can_rx_id            = 0x280        ; Gerät → bridge
heartbeat_interval_ms = 1000
heartbeat_timeout_ms  = 3000        ; Nach 3 s ohne Heartbeat → OFFLINE-Eintrag in bridgeError.log
name                 = k_Horizon
description          = Künstlicher Horizont
type                 = attitude_indicator

[module.horizon.simvars]
; Format: VARIABLE NAME|einheit|field_id
; Die field_id bestimmt Bedeutung, Datentyp und Byte-Position im CAN-Frame.
; Byte-Bedarf und Typ stehen in [field_ids] als Kommentar dokumentiert.

; ── Modus 1: Gyro (ATTITUDE INDICATOR, mit Drift) ────────────────────────────
; Querneigung und Längsneigung vom simulierten Kreisel
ATTITUDE INDICATOR BANK DEGREES|radians|0x01
ATTITUDE INDICATOR PITCH DEGREES|radians|0x02

; ── Modus 2: Direkt (PLANE, ohne Drift) — Gyro auskommentieren, diese aktivieren
; PLANE BANK DEGREES|radians|0x03
; PLANE PITCH DEGREES|radians|0x04

; ── Kugel / Querneigungsanzeige (immer aktiv) ────────────────────────────────
;TURN COORDINATOR BALL|number|0x05
INCIDENCE BETA|radians|0x09
ACCELERATION BODY X|feet per second squared|0x0A
ACCELERATION BODY Y|feet per second squared|0x0B
PLANE BANK DEGREES|radians|0x03
PLANE PITCH DEGREES|radians|0x04

; ── Failure-Modus A: einfaches Sim-Ausfallmodell ─────────────────────────────
PARTIAL PANEL ATTITUDE|status|0x06

; ── Failure-Modus B: reale Avionics-Simulation ───────────────────────────────
; Modus A auskommentieren und diese beiden aktivieren → Modus B
; AVIONICS MASTER SWITCH|bool|0x07
; LOW VOLTAGE WARNING|bool|0x08

[module.horizon.config]
; Init-Parameter: werden beim Start einmalig per CAN an das Gerät gesendet (Pakettyp 0xFB).
; Das Gerät wertet sie bei der Initialisierung aus.
; Schlüssel werden über [config_ids] in eine config_id aufgelöst.
slip_mode = 0        ; 0 = INCIDENCE_BETA (ideal), 1 = ACCEL_DAMPED (physikalisch)
;
; Mögliche zukünftige Parameter (geräteseitig noch nicht implementiert):
; brightness  = 80     ; Display-Helligkeit in Prozent (0–100)
; backlight   = 255    ; Hintergrundbeleuchtung (0–255)
; contrast    = 128    ; Kontrast (0–255)
; orientation = 0      ; Einbaulage: 0=normal, 1=um 180° gedreht

; ─── Weitere Instrumente hier eintragen ──────────────────────────────────────
; (Referenz-Vorlage: [instrument.demo] weiter unten)

; ══════════════════════════════════════════════════════════════════════════════
; DEMO / REFERENZ-VORLAGEN — vollständig auskommentiert
;
; Kopieren, KURZNAME ersetzen und Kommentarzeichen entfernen.
; can_tx_id und can_rx_id sind Pflichtfelder und müssen systemweit eindeutig sein.
; Nur vorhandene Subsektionen werden ausgewertet — Fähigkeiten ergeben sich automatisch.
; ══════════════════════════════════════════════════════════════════════════════

; ── Vorlage A: Reines Anzeige-Gerät (nur SimConnect → CAN-FD) ────────────────
;
; [module.KURZNAME]
; can_tx_id   = 0x201        ; bridge → Gerät (systemweit eindeutig)
; can_rx_id   = 0x281        ; Gerät → bridge (systemweit eindeutig)
; name        = k_KURZNAME   ; Kurzname für Debug-Ausgabe (kein Leerzeichen)
; description = Lesbare Bezeichnung
; type        = attitude_indicator   ; Frame-Typ (attitude_indicator, …)
;
; [module.KURZNAME.simvars]
; ; Format: VARIABLE NAME|einheit    (Einheit optional, Standard: number)
; ;
; ; Lage:
; PLANE BANK DEGREES|radians          ; Querneigung direkt (kein Drift)
; PLANE PITCH DEGREES|radians         ; Längsneigung direkt
; ATTITUDE INDICATOR BANK DEGREES|radians  ; Gyro-Querneigung (mit Drift)
; ATTITUDE INDICATOR PITCH DEGREES|radians ; Gyro-Längsneigung
; ;
; ; Navigation:
; PLANE HEADING DEGREES MAGNETIC|degrees  ; Magnetischer Kurs 0–360°
; PLANE ALTITUDE|feet                     ; Höhe in Fuß
; VERTICAL SPEED|feet per minute          ; Steigrate
; AIRSPEED INDICATED|knots                ; Angezeigte Fluggeschwindigkeit
; ;
; ; Systeme / Status (für Kontrollleuchten und LEDs):
; AUTOPILOT MASTER|bool              ; AP-Taste leuchtet
; AUTOPILOT HEADING LOCK|bool        ; HDG-Mode aktiv
; AUTOPILOT NAV1 LOCK|bool           ; NAV-Mode aktiv
; GEAR IS DOWN AND LOCKED|bool       ; Fahrwerk-LED
; FLAPS HANDLE PERCENT|percent       ; Klappen-Lichtleiste 0–100%
; AVIONICS MASTER SWITCH|bool        ; Avionics-Hauptschalter
; LOW VOLTAGE WARNING|bool           ; Spannungswarnung
; IS SLEW ACTIVE|bool                ; Slew-Modus aktiv
; PARTIAL PANEL ATTITUDE|status      ; Sim-Ausfallmodell (0=ok/1=warn/2=fail)
; TURN COORDINATOR BALL|number       ; Kugel (-128..+128, 0=koordiniert)
; ;
; ; Triebwerk / Kraftstoff:
; ENG N1 RPM:1|percent               ; N1 Triebwerk 1 in Prozent
; FUEL TOTAL QUANTITY|gallons        ; Gesamtkraftstoff in Gallonen
; ;
; ; Wetter / Umgebung:
; AMBIENT TEMPERATURE|celsius        ; Außentemperatur
; KOHLSMAN SETTING MB:1|mbar         ; Höhenmesser-Einstellung
;
; [module.KURZNAME.config]
; brightness  = 80
; backlight   = 200
; orientation = 0

; ── Vorlage B: Reines Input-Modul (nur Buttons/Achsen → HID) ─────────────────
;
; [module.KURZNAME]
; can_tx_id            = 0x623        ; bridge → Gerät
; can_rx_id            = 0x6A3        ; Gerät → bridge
; description          = Panel-Bezeichnung
; heartbeat_timeout_ms = 3000
;
