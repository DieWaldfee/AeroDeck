; ══════════════════════════════════════════════════════════════════════════════
; EINHEITEN-BYTE-TABELLE
;
; Wird von bridge_exe UND bridge_monitor gelesen und bestimmt die Byte-Größe
; jedes Feldes im CAN-Frame. Beide Komponenten verwenden ausschließlich diese
; Werte — es gibt keine separaten Hardcoded-Tabellen mehr.
;
; !! NICHT ÄNDERN !!
; Die Werte hier müssen mit der Instrument-Firmware übereinstimmen.
; Eine Änderung erfordert ein Firmware-Update aller angeschlossenen Instrumente.
; ══════════════════════════════════════════════════════════════════════════════
