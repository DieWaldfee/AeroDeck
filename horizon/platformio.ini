[env:waveshare_esp32s3_lcd_128]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; TFT_eSPI-Konfiguration via Build-Flags (kein User_Setup.h nötig)
; WICHTIG: Diese Defines müssen in build_flags stehen (gilt für src/ UND Libs).
; build_src_flags gilt nur für src/ – TFT_eSPI würde die Treiber-Defines nicht sehen.
build_flags =
    -DHORIZON_DEBUG=2           ; 0=nur Fehler  1=Boot+Events  2=verbose
    -I"C:/Users/matth/.platformio/packages/toolchain-xtensa-esp32s3/xtensa-esp32s3-elf/sys-include"
    "-D__assert_func(f,l,fn,e)=abort()"
    -Wno-unused-parameter
    -Wno-shadow
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_MOSI=11
    -DTFT_SCLK=10
    -DTFT_CS=9
    -DTFT_DC=8
    -DTFT_RST=12
    -DTFT_BL=40
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    pierremolinaro/ACAN2517FD@^2.1.8
